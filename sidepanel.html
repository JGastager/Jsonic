<!DOCTYPE html>
<html>
<head>
  <title>JSON Parse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <ul id="json-tabs">
      <li id="add-json-li">
        <button id="add-json-btn" class="btn" data-tooltip="Add custom JSON">
          <span class="i-plus"></span>
        </button>
      </li>
    </ul>
  </nav>

  <div id="panel-toolbar">
    <div id="search-input-wrap" style="display:none">
      <span class="i-search"></span>
      <input id="search-input" type="text" placeholder="Search keys &amp; values…" spellcheck="false" autocomplete="off">
      <button id="search-opt-case" class="search-opt-btn" data-tooltip="Match Case  Alt+C">Aa</button>
      <button id="search-opt-word" class="search-opt-btn" data-tooltip="Match Whole Word  Alt+W">\b</button>
      <button id="search-opt-regex" class="search-opt-btn" data-tooltip="Use Regex  Alt+R">.*</button>
      <span class="search-opt-sep"></span>
      <span id="search-count"></span>
      <button id="search-prev" class="search-nav-btn" data-tooltip="Previous match  Shift+Enter"><span class="i-search-prev"></span></button>
      <button id="search-next" class="search-nav-btn" data-tooltip="Next match  Enter"><span class="i-search-next"></span></button>
      <button id="search-close" data-tooltip="Close search  Esc"><span class="i-search-close"></span></button>
    </div>
    <button class="btn panel-toolbar-btn" id="toolbar-search-btn" data-tooltip="Search  Ctrl+F">
      <span class="i-search-btn"></span>
    </button>
    <button class="btn panel-toolbar-btn" id="toolbar-raw-btn" data-tooltip="Display raw JSON">
      <span class="i-raw"></span>
    </button>
    <a href="options.html" target="_blank" class="btn panel-toolbar-btn" data-tooltip="Open settings  Ctrl+,">
      <span class="i-gear"></span>
    </a>
  </div>
  <main id="json-panels">
    <div class="jp-path-preview" id="jp-path-preview"></div>
  </main>
  <script src="tree-render.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
